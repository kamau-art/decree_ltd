services:
  postgres:
    image: postgres:16
    container_name: decree_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: decree_ltd_pass
      POSTGRES_DB: decree_ltd
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d decree_ltd"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
